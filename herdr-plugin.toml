id = "j1nn0.herdr-harvest"
name = "Harvest"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "Harvest the results of your agent herd — capture an agent's output when it finishes into a durable Result Inbox."
platforms = ["linux", "macos", "windows"]

# `herdr plugin install` clones this repository without `node_modules/`, so the
# runtime dependencies have to be installed before Herdr registers the plugin.
# Herdr runs build commands only for a GitHub install, after confirmation and
# before registration, and aborts the install if one fails.
#
# `npm ci` rather than `npm install` so the tree is reproduced exactly from
# `package-lock.json`, and `--omit=dev` because only the runtime dependencies
# (`@j1nn0/herdr-plugin-sdk`, `ink`, `react`) are needed. There is no compile
# step: Node 24 runs the TypeScript sources directly via type stripping.
[[build]]
command = ["npm", "ci", "--omit=dev"]

# Fires on every pane agent status transition. The hook needs all of them: it
# records the observed status per Herdr session and pane so it can tell a real
# completion from an ordinary `idle`, and captures only the transitions that
# qualify.
[[events]]
on = "pane.agent_status_changed"
command = ["node", "src/bin/hook.ts"]

# The Result Inbox TUI. `overlay` opens a temporary zoomed overlay over the
# active pane and restores the previous focus and zoom when it closes, which
# suits a transient inbox while still giving the pane a real pane id.
[[panes]]
id = "inbox"
title = "Harvest Inbox"
placement = "overlay"
command = ["node", "src/bin/inbox.ts"]

[[actions]]
id = "open"
title = "Open Harvest Inbox"
description = "Open the Harvest Result Inbox"
contexts = ["global"]
command = ["node", "src/bin/open.ts"]
